name: Windows tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node.js 24
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node.js 24
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build Windows launcher and release archive
        shell: pwsh
        run: |
          ./BuildLauncher.ps1
          ./scripts/Build-Release.ps1
      - name: Backend, tracker, native lifecycle and extracted archive
        shell: pwsh
        run: python -m unittest discover -v
      - name: Dashboard syntax
        shell: pwsh
        run: node --check web/app.js
      - name: Dashboard behavior
        shell: pwsh
        run: node --test web/test_app.cjs
      - name: Upload tested Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: LocalTimerAI-windows-x64
          path: |
            dist/LocalTimerAI-*-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
