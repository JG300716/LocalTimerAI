name: Windows tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build Windows launcher and release archive
        shell: pwsh
        run: |
          ./BuildLauncher.ps1
          ./scripts/Build-Release.ps1
      - name: Backend, tracker, native lifecycle and extracted archive
        shell: pwsh
        run: python -m unittest discover -v
      - name: Dashboard syntax
        shell: pwsh
        run: node --check web/app.js
      - name: Dashboard behavior
        shell: pwsh
        run: node --test web/test_app.cjs
      - name: Upload tested Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LocalTimerAI-windows-x64
          path: |
            dist/LocalTimerAI-*-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
